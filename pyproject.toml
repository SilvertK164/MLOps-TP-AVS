[project]
name = "mlops-tp-avs"
version = "0.1.0"
description = "TP de Operaciones de Aprendizaje Automático I (CEIA-FIUBA): el modelo de burnout de AMq1 en un entorno productivo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "xgboost>=3.0",
    "optuna>=4.3",
    "mlflow>=3.5",
    "boto3>=1.38",
    "pyarrow>=18",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "requests>=2.32",
]

[project.optional-dependencies]
# Notebooks, clases interactivas y herramientas de desarrollo
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
# N803/N806: X, X_train, X_test son la convención de nombres en ML
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Notebooks didácticos: imports por sección, líneas de texto largas y celdas de ejercicio a completar
"*.ipynb" = ["E402", "E501", "F401", "F841", "I001"]
